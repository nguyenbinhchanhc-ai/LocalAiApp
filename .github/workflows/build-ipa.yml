name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Cho phép bấm chạy bằng tay trên GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          latest_xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Found latest Xcode at: $latest_xcode"
          sudo xcode-select -s "$latest_xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Patch Script explicitly
        run: node scripts/patch-expo-jsi.js

      - name: Verify Patch Applied
        run: |
          grep -A 5 "SYMROOT" node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || echo "SYMROOT not found in file"


      - name: Expo Prebuild (Generate iOS folder)
        run: npx expo prebuild -p ios --clean

      - name: Setup Node Binary for Xcode
        run: |
          cd ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned Archive
        run: |
          cd ios
          export NODE_BINARY=$(command -v node)
          xcodebuild -workspace LocalAiApp.xcworkspace \
            -scheme LocalAiApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            NODE_BINARY="$NODE_BINARY" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Create IPA payload
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r LocalAiApp.app Payload/
          zip -r LocalAiApp.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalAiApp-Unsigned-IPA
          path: ios/build/Build/Products/Release-iphoneos/LocalAiApp.ipa
